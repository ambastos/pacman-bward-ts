<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <!--script async src='https://www.googletagmanager.com/gtag/js?id=UA-142539004-1'></script-->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'UA-142539004-1');
    </script>

    <!-- <script
    src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"></script> -->
    <script src="build/libraries/jquery-3.7.1.slim.min.js.js"></script>
    <script src='build/app.js'></script>
    
    <link rel='shortcut icon' type='image/x-icon' href='favicon.ico'>
    <link href='https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/icon?family=Material+Icons'
      rel='stylesheet'>
    <title>Pacman</title>
  </head>
  <body>
    <div id='overflow-mask' class='overflow-mask'>
      <img id='backdrop' class='backdrop' src='app/style/graphics/backdrop.png'>

      <div id='fps-display' class='fps-display'></div>
      <div id='preload-div' class='preload-div'></div>

      <div id='main-menu-container' class='main-menu-container'>
        <img id='logo' class='logo' src='app/style/graphics/pacman_logo.png'>
        <button id='game-start' class='game-start'>
          PLAY
        </button>
        <button id='config-btn-menu' class='config-start-btn'>
          Configurations...
        </button>
      </div>

      <button id='config-btn-game' class='config-btn-game'>
        Configurations...
      </button>

      <div class='header-buttons'>
        <button>
          <i id='pause-button' class='material-icons'>
            pause
          </i>
        </button>
        <button>
          <i id='sound-button' class='material-icons'></i>
        </button>
      </div>

      <div id='paused-text' class='paused-text'>
        PAUSED
      </div>

      <div id='game-ui' class='game-ui'>
        <div id='row-top' class='row top'></div>
        <div id='maze' class='maze'>
          <div id='maze-cover' class='maze-cover'></div>
        </div> 

        <div id='bottom-row' class='row bottom'></div>
      </div>

      <div id='movement-buttons' class='movement-buttons'>
        <div class='row'>
          <button id='button-up' class='button-up'>
            <i class='material-icons'>keyboard_arrow_up</i>
          </button>
        </div>
        <div class='row'>
          <button id='button-left' class='button-left'>
            <i class='material-icons'>keyboard_arrow_left</i>
          </button>
          <button id='button-right' class='button-right'>
            <i class='material-icons'>keyboard_arrow_right</i>
          </button>
        </div>
        <div class='row'>
          <button id='button-down' class='button-down'>
            <i class='material-icons'>keyboard_arrow_down</i>
          </button>
        </div>
      </div>

      <div id='settings-modal' class='settings-backdrop'>
        <div class='settings-panel'>
          <button id='settings-close' class='settings-close'>&times;</button>
          <h2 class='settings-title'>Configurations</h2>
          <div class='settings-row'>
            <span class='settings-label'>Enable Debug</span>
            <input type='checkbox' id='cfg-debug' class='settings-check'>
            <button id='cfg-debug-dots' class='settings-dots' title='Debug'>
              <i class='material-icons'>more_vert</i>
            </button>
          </div>
          <div class='settings-row'>
            <span class='settings-label'>Mods</span>
            <select id='cfg-mod' class='settings-select'>             
              <option value='none'>None</option>
            </select>
            <button id='cfg-mod-dots' class='settings-dots' title='Configure Mod'>
              <i class='material-icons'>more_vert</i>
            </button>
          </div>
          <div id='settings-tip' class='settings-tip'></div>
        </div>
      </div>

      <div id='debug-modal' class='settings-backdrop'>
        <div class='settings-panel'>
          <button id='debug-close' class='settings-close'>&times;</button>
          <h2 class='settings-title'>Debug</h2>
          <div class='settings-row'>
            <label class='settings-label' for='dbg-lives'>Lives</label>
            <input type='number' id='dbg-lives' class='settings-num' min='0' step='1'>
          </div>
          <div class='settings-row'>
            <label class='settings-label' for='dbg-immortality'>Immortality</label>
            <input type='checkbox' id='dbg-immortality' class='settings-check'>
          </div>
          <div class='settings-row settings-ghost-row'>
            <span class='settings-label'>Enable ghosts</span>
            <div class='ghost-checks'>
              <label><input type='checkbox' id='dbg-ghost-blinky'>blinky</label>
              <label><input type='checkbox' id='dbg-ghost-pinky'>pinky</label>
              <label><input type='checkbox' id='dbg-ghost-inky'>inky</label>
              <label><input type='checkbox' id='dbg-ghost-clyde'>clyde</label>
            </div>
          </div>
          <div class='settings-row'>
            <label class='settings-label' for='dbg-level'>Level</label>
            <input type='number' id='dbg-level' class='settings-num' min='1' step='1'>
          </div>
          <div class='settings-row'>
            <label class='settings-label' for='dbg-bounds'>Enable Bounds and Hit Box</label>
            <input type='checkbox' id='dbg-bounds' class='settings-check'>
          </div>
          <div class='settings-row'>
            <label class='settings-label' for='dbg-grid'>Show Grid</label>
            <input type='checkbox' id='dbg-grid' class='settings-check'>
          </div>
        </div>
      </div>

      <div id='left-cover' class='loading-cover left'></div>
      <div id='right-cover' class='loading-cover right'></div>
      <div id='loading-container' class='loading-container'>
        <div id='loading-pacman' class='loading-pacman'></div>
        <div id='loading-dot-mask' class='loading-dot-mask'></div>
        <div class='loading-dot _5'></div>
        <div class='loading-dot _10'></div>
        <div class='loading-dot _15'></div>
        <div class='loading-dot _20'></div>
        <div class='loading-dot _25'></div>
        <div class='loading-dot _30'></div>
        <div class='loading-dot _35'></div>
        <div class='loading-dot _40'></div>
        <div class='loading-dot _45'></div>
        <div class='loading-dot _50'></div>
        <div class='loading-dot _55'></div>
        <div class='loading-dot _60'></div>
        <div class='loading-dot _65'></div>
        <div class='loading-dot _70'></div>
        <div class='loading-dot _75'></div>
        <div class='loading-dot _80'></div>
        <div class='loading-dot _85'></div>
        <div class='loading-dot _90'></div>
        <div class='loading-dot _95'></div>
      </div>

      <div id='error-message' class='error-message'>
        <div class='header'>
          <div>OOPS!</div>
          <div class='error-pacman'></div>
        </div>
        <div class='body'>
          We were unable to load the images/sounds needed to play the game.</br></br>

          This could be due to a poor connection, a strict network policy, or
          by playing on an unsupported browser.
        </div>
      </div>
    </div>
  </body>
</html>
